metrics:
  - id: code.cyclomatic_complexity_band
    name: Cyclomatic Complexity Band
    function: CyclomaticComplexityAgent.evaluate
    description: "Evaluates function/method complexity across the repo; flags excessive branching or deep nesting that reduces maintainability."

  - id: code.maintainability_band
    name: Maintainability Band
    function: MaintainabilityAgent.evaluate
    description: "Assesses maintainability index of the codebase; highlights readability, cohesion, and modularity gaps."

  - id: code.docstring_coverage_band
    name: Docstring Coverage Band
    function: DocstringCoverageAgent.evaluate
    description: "Measures docstring coverage and quality across functions/classes; flags missing or incomplete documentation."

  - id: code.nested_loops_band
    name: Nested Loops Band
    function: NestedLoopsAgent.evaluate
    description: "Detects deeply nested loops and control structures; identifies areas needing refactor to improve efficiency."

  - id: repo.tests_presence
    name: Tests Presence & Coverage
    function: TestDetectionAgent.evaluate
    description: "Detects presence and quality of test files and coverage; rates robustness of testing practices."

  - id: repo.env_config_hygiene
    name: Environment & Config Hygiene
    function: EnvironmentConfigAgent.evaluate
    description: "Checks existence and quality of dependency/environment files (requirements.txt, pyproject.toml, etc.); flags inconsistencies."

  - id: repo.cicd_presence
    name: CI/CD Presence & Quality
    function: CICDAgent.evaluate
    description: "Evaluates presence and quality of CI/CD workflows; highlights automation gaps in build/test/deploy."

  - id: repo.deployment_readiness
    name: Deployment Readiness
    function: DeploymentAgent.evaluate
    description: "Analyzes deployment scripts and automation; assesses readiness for reliable rollouts and rollback."

  - id: repo.experiments_management
    name: Experiments Management
    function: ExperimentDetectionAgent.evaluate
    description: "Inspects repo for experiment directories/configs; rates standardization and reproducibility of ML experimentation."

  - id: repo.project_structure
    name: Project Structure & Docs
    function: ProjectStructureAgent.evaluate
    description: "Reviews overall repo structure and documentation; flags missing READMEs, inconsistent layout, or weak contribution guidelines."

  - id: parallel_patterns
    name: Parallel & Concurrency Patterns
    function: ParallelPatternsAgent.evaluate
    description: "Assesses use of concurrency libraries (threading, asyncio, Ray); flags unsafe or inefficient parallel patterns."

  - id: inference_endpoint
    name: Inference Endpoint Quality
    function: InferenceEndpointAgent.evaluate
    description: "Reviews serving endpoints (FastAPI/Flask/gRPC); checks for validation, error handling, and health/readiness probes."

  - id: model_export
    name: Model Export Practices
    function: ModelExportAgent.evaluate
    description: "Evaluates model export practices (ONNX, TorchScript, TF SavedModel); checks versioning, metadata, and portability."

  - id: data_pipeline
    name: Data Pipeline Engineering
    function: DataPipelineAgent.evaluate
    description: "Examines data pipeline definitions (Airflow, Prefect, Kedro); highlights lack of retries, alerts, or observability."

  - id: feature_engineering
    name: Feature Engineering Hygiene
    function: FeatureEngineeringAgent.evaluate
    description: "Reviews feature engineering code for reproducibility and parity between training and serving."

  - id: security_hygiene
    name: Security Hygiene
    function: SecurityAgent.evaluate
    description: "Scans for security hygiene issues (secrets in code, weak crypto, missing access controls); flags risks."

  - id: ml.framework_maturity
    name: ML Framework Maturity
    function: MLFrameworkAgent.evaluate
    description: "Assesses maturity of ML framework usage (PyTorch, TensorFlow, scikit-learn); checks for idiomatic and consistent patterns."

  - id: ml.experiment_tracking
    name: Experiment Tracking
    function: ExperimentTrackingAgent.evaluate
    description: "Inspects logging/tracking (MLflow, Weights & Biases); evaluates completeness of parameter, metric, and artifact tracking."

  - id: ml.hpo_practice
    name: Hyperparameter Optimization Practice
    function: HyperparameterOptimizationAgent.evaluate
    description: "Reviews hyperparameter tuning setup (Optuna, Ray Tune); checks reproducibility and persistence of best configs."

  - id: ml.data_validation
    name: Data Validation
    function: DataValidationAgent.evaluate
    description: "Analyzes schema/range/drift validation in pipelines; highlights missing quality gates or CI integration."

  - id: ml.training_practice
    name: Training Practice
    function: ModelTrainingAgent.evaluate
    description: "Reviews training workflows for reproducibility, config-driven runs, checkpointing, and restart capability."

  - id: ml.evaluation_practice
    name: Evaluation Practice
    function: ModelEvaluationAgent.evaluate
    description: "Evaluates evaluation methodology; checks breadth of metrics, fairness checks, and quality of reporting/visualizations."
