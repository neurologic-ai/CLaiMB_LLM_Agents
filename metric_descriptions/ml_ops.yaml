metrics:
  - id: mlflow.experiment_completeness_band
    description: "Assesses whether experiments are fully logged with metrics, parameters, and artifacts; flags missing or partial runs that hinder reproducibility."

  - id: mlflow.lineage_coverage_band
    description: "Evaluates coverage of lineage metadata across MLflow runs, ensuring parameter–artifact–model links are complete; highlights gaps in traceability."

  - id: mlflow.experiment_velocity_band
    description: "Measures speed and throughput of experiment iterations (runs per week, completion time); flags bottlenecks in model experimentation."

  - id: mlflow.registry_hygiene_band
    description: "Rates hygiene of the model registry (naming conventions, stage usage, deprecation practices); highlights cluttered or ambiguous registry states."

  - id: mlflow.validation_artifacts_band
    description: "Checks for presence and completeness of validation artifacts (confusion matrices, performance logs, fairness metrics) stored alongside models."

  - id: mlflow.reproducibility_band
    description: "Evaluates extent of reproducibility (versioned code, dataset hashes, env captures) across MLflow runs; flags missing seeds, dependencies, or environment metadata."

  - id: aml.endpoint_slo_band
    description: "Measures deployed endpoint adherence to SLAs (latency, uptime, error budget); flags violations and unstable serving deployments."

  - id: aml.jobs_flow_band
    description: "Evaluates orchestration of AML jobs (pipelines, step dependencies, retries); highlights brittle flows or manual interventions."

  - id: aml.monitoring_coverage_band
    description: "Rates coverage of production monitoring (drift detection, performance dashboards, alerting rules); flags blind spots in live model oversight."

  - id: aml.registry_governance_band
    description: "Assesses governance of AML registry (access controls, audit logs, ownership metadata); highlights weak accountability and regulatory gaps."

  - id: aml.cost_correlation_band
    description: "Analyzes correlation of AML workloads with cost drivers (compute usage vs. run output); flags inefficient or unoptimized spending."

  - id: sm.endpoint_slo_scaling_band
    description: "Measures endpoint SLO adherence under scaling events (autoscaling latency, throughput); flags overloads and slow ramp-up behavior."

  - id: sm.pipeline_flow_band
    description: "Evaluates SageMaker pipeline orchestration (step modularity, branching, caching); highlights fragility or poor reusability in flows."

  - id: sm.experiments_lineage_band
    description: "Assesses lineage capture within SageMaker Experiments; flags missing links between datasets, code, and models."

  - id: sm.clarify_coverage_band
    description: "Rates coverage of fairness & explainability artifacts generated by SageMaker Clarify; flags missing bias reports or incomplete explanations."

  - id: sm.cost_efficiency_band
    description: "Evaluates efficiency of SageMaker workloads (instance utilization, idle compute, training cost vs. output quality)."

  - id: cicd.deploy_frequency_band
    description: "Measures deployment frequency of ML-related services/models; higher frequency indicates mature MLOps practice."

  - id: cicd.lead_time_band
    description: "Evaluates lead time from code commit to deployed ML service; flags long pipelines or manual approval bottlenecks."

  - id: cicd.change_failure_rate_band
    description: "Assesses failure rate of deployments (rollbacks, hotfixes); high values indicate fragile ML CI/CD practices."

  - id: cicd.policy_gates_band
    description: "Rates enforcement of policy gates (linting, tests, security scans, approval workflows) in ML CI/CD pipelines."